
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            padding: 40px;
            margin: auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>This is my first HTML web page.</p>

        <button onclick="alert('Hello! Welcome to my website.')">
            Click Me
        </button>
    </div>

</body>
</html>
